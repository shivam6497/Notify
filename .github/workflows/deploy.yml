name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/shivam6497/notify

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed for HEAD^1 comparison

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install

      # Check what changed using Turborepo
      - name: Detect changed services
        id: changes
        run: |
          pnpm turbo run build --filter=...[HEAD^1] --dry=json > turbo-out.json
          echo "httpserver=$(cat turbo-out.json | jq '[.tasks[].taskId] | any(contains("httpserver"))')" >> $GITHUB_OUTPUT
          echo "ws=$(cat turbo-out.json | jq '[.tasks[].taskId] | any(contains("ws#"))')" >> $GITHUB_OUTPUT
          echo "workers=$(cat turbo-out.json | jq '[.tasks[].taskId] | any(contains("workers#"))')" >> $GITHUB_OUTPUT
          echo "client=$(cat turbo-out.json | jq '[.tasks[].taskId] | any(contains("client#"))')" >> $GITHUB_OUTPUT
          echo "demo=$(cat turbo-out.json | jq '[.tasks[].taskId] | any(contains("demo#"))')" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build only changed services
      - uses: docker/build-push-action@v5
        if: steps.changes.outputs.httpserver == 'true'
        with:
          context: .
          file: ./apps/httpserver/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-httpserver:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v5
        if: steps.changes.outputs.ws == 'true'
        with:
          context: .
          file: ./apps/ws/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-ws:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v5
        if: steps.changes.outputs.workers == 'true'
        with:
          context: .
          file: ./apps/workers/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-workers:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v5
        if: steps.changes.outputs.client == 'true'
        with:
          context: .
          file: ./apps/client/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}

      - uses: docker/build-push-action@v5
        if: steps.changes.outputs.demo == 'true'
        with:
          context: .
          file: ./apps/demo/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-demo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy only changed services to EC2
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: CHANGED_HTTPSERVER=${{ steps.changes.outputs.httpserver }},CHANGED_WS=${{ steps.changes.outputs.ws }},CHANGED_workers=${{ steps.changes.outputs.workers }},CHANGED_CLIENT=${{ steps.changes.outputs.client }},CHANGED_DEMO=${{ steps.changes.outputs.demo }},IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            [ "$CHANGED_HTTPSERVER" == "true" ] && docker pull $IMAGE_PREFIX-httpserver:latest && docker compose up -d --no-deps httpserver
            [ "$CHANGED_WS" == "true" ] && docker pull $IMAGE_PREFIX-ws:latest && docker compose up -d --no-deps ws
            [ "$CHANGED_workers" == "true" ] && docker pull $IMAGE_PREFIX-workers:latest && docker compose up -d --no-deps workers
            [ "$CHANGED_CLIENT" == "true" ] && docker pull $IMAGE_PREFIX-client:latest && docker compose up -d --no-deps client
            [ "$CHANGED_DEMO" == "true" ] && docker pull $IMAGE_PREFIX-demo:latest && docker compose up -d --no-deps demo
            
            docker image prune -f